<script>
  function checkTokenAndRender() {
    const token = localStorage.getItem("jwt_token");

    if (!token) {
      window.location.href = "index.php";
      return;
    }

    try {
      const decoded = jwt_decode(token);
      const now = Math.floor(Date.now() / 1000);

      if (decoded.exp < now) {
        throw new Error("Token expired");
      }

      document.getElementById("welcome").textContent = `Welcome, ${decoded.username || decoded.login_id}!`;

      // ✅ Fetch data but don’t auto-logout if API fails
      fetch("data-api.php", {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token
        }
      })
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("scoreContainer");

        if (data.error) {
          container.innerHTML = `<p style="color: red;">${data.error}</p>`;
          console.warn("⚠️ API returned error:", data.error);
          return;
        }

        if (Array.isArray(data) && data.length > 0) {
          container.innerHTML = data.map(score => `
            <div class="score-card">
              <strong>Profile ID:</strong> ${score.profile_id}<br />
              <strong>DB Score:</strong> ${score.Db_Score}<br />
              <strong>Gut Score:</strong> ${score.Gut_Score_per}<br />
              <strong>Liver Score:</strong> ${score.liver_score}<br />
              <strong>Blow Score:</strong> ${score.Blow_Score}<br />
              <strong>Date:</strong> ${score.dttm}
            </div>
          `).join('');
        } else {
          container.innerHTML = "<p>No scores found.</p>";
        }
      })
      .catch(err => {
        console.warn("API fetch failed (but not logging out):", err.message);
        document.getElementById("scoreContainer").innerHTML = "<p style='color:red;'>Failed to load scores. Please try again.</p>";
      });

    } catch (err) {
      console.warn("Invalid or expired token:", err.message);
      localStorage.removeItem("jwt_token");
      window.location.href = "index.php";
    }
  }

  function logout() {
    localStorage.removeItem("jwt_token");
    window.location.href = "index.php";
  }

  window.addEventListener("pageshow", checkTokenAndRender);
</script>
