<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Respyr Portal &mdash; Forgot password</title>
    <link rel="shortcut icon" href="https://respyr.in/fav.svg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <style>
        :root {
            --canvas: #e8edf4; --card: #ffffff; --dark: #252525;
            --blue: #308bf9; --blue-light: #e9f3ff; --red: #e74c3c; --green: #3faf58;
            --tx1: #252525; --tx2: #535359; --tx3: #738298;
            --line: #e1e6ed; --edge: #c8d3e2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Poppins", sans-serif; background: var(--canvas);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .shell {
            display: flex; width: 100%; max-width: 1020px; min-height: 600px;
            background: var(--card); border: 1px solid var(--edge); border-radius: 20px; overflow: hidden;
            box-shadow: 0 1px 3px rgba(37, 37, 37, 0.05), 0 24px 70px rgba(37, 37, 37, 0.16);
            animation: cardIn 0.25s ease-out;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .hero {
            flex: 1.15; background: linear-gradient(165deg, #eaf3ff 0%, #dcebfd 60%, #d3e6fc 100%);
            display: flex; align-items: center; justify-content: center; padding: 44px 40px;
        }
        .hero-inner { max-width: 430px; text-align: center; }
        .hero-inner h2 { font-size: 21px; font-weight: 600; letter-spacing: -0.42px; color: #1b4e9b; line-height: 1.35; margin-bottom: 6px; }
        .hero-inner p { font-size: 12.5px; letter-spacing: -0.25px; color: #4a6ea8; margin-bottom: 22px; }
        /* aspect-ratio + cover crops off the blurred watermark baked into the
           bottom of the source photo (shared with the report, so not re-cut) */
        .hero-img { width: 100%; aspect-ratio: 595 / 430; object-fit: cover; object-position: top; border-radius: 16px; box-shadow: 0 16px 40px rgba(27, 78, 155, 0.22); display: block; }
        .panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 44px 40px; }
        .panel-inner { width: 100%; max-width: 330px; }
        .logo { display: block; margin: 0 auto 22px; height: 32px; }
        h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; color: var(--tx1); text-align: center; margin-bottom: 4px; }
        .sub { font-size: 12.5px; color: var(--tx3); letter-spacing: -0.25px; text-align: center; margin-bottom: 26px; line-height: 1.5; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; font-weight: 500; letter-spacing: -0.24px; color: var(--tx2); margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap input {
            width: 100%; height: 44px; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
            padding: 0 42px 0 14px; font-family: "Poppins", sans-serif; font-size: 13px; letter-spacing: -0.26px;
            color: var(--tx1); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-wrap input::placeholder { color: #a9b3c4; }
        .input-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
        .input-ico { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #a9b3c4; font-size: 13px; pointer-events: none; }
        .alert-err, .alert-ok {
            display: none; font-size: 12px; letter-spacing: -0.24px; border-radius: 8px;
            padding: 9px 12px; margin-bottom: 16px; align-items: center; gap: 8px;
        }
        .alert-err { color: var(--red); background: #fdecea; border: 1px solid rgba(231, 76, 60, 0.25); }
        .alert-ok { color: #1f7a38; background: #eaffef; border: 1px solid rgba(63, 175, 88, 0.3); }
        .alert-err.show { display: flex; animation: shake 0.3s; }
        .alert-ok.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .btn-primary-dark {
            width: 100%; height: 46px; background: var(--dark); color: #fff; border: none; border-radius: 15px;
            font-family: "Poppins", sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: -0.27px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
            box-shadow: 0 4px 12px rgba(37, 37, 37, 0.25); transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        }
        .btn-primary-dark:hover { background: #3a3a3a; box-shadow: 0 6px 16px rgba(37, 37, 37, 0.32); transform: translateY(-1px); }
        .btn-primary-dark:active { transform: translateY(0); }
        .btn-primary-dark:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .backlink {
            display: block; text-align: center; margin-top: 18px; font-size: 12.5px; font-weight: 500;
            letter-spacing: -0.25px; color: var(--blue); text-decoration: none;
        }
        .backlink:hover { text-decoration: underline; }

        /* OTP step */
        .otp-inputs { display: flex; gap: 12px; justify-content: center; margin: 4px 0 16px; }
        .otp-inputs .input {
            width: 58px; height: 58px; text-align: center;
            font-family: "Poppins", sans-serif; font-size: 22px; font-weight: 600; color: var(--tx1);
            border: 1px solid var(--line); border-radius: 10px; outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .otp-inputs .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
        .otp-inputs .input.err { border-color: var(--red); }
        #countdown { text-align: center; font-size: 12px; color: var(--tx3); letter-spacing: -0.24px; margin: 0 0 8px; min-height: 18px; }
        .resend {
            display: none; margin: 0 auto 8px; background: none; border: none; cursor: pointer;
            font-family: "Poppins", sans-serif; font-size: 12.5px; font-weight: 500; letter-spacing: -0.25px; color: var(--blue);
        }
        .resend:hover { text-decoration: underline; }

        @media (max-width: 880px) {
            .shell { max-width: 420px; min-height: 0; }
            .hero { display: none; }
            .panel { padding: 40px 32px; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <aside class="hero">
            <div class="hero-inner">
                <h2>India's first breath-based<br />health screening device</h2>
                <p>Four health scores from a single breath.</p>
                <img class="hero-img" src="../../../report/report_images/1.jpg" alt="Respyr breath screening device in use" />
            </div>
        </aside>

        <section class="panel">
            <div class="panel-inner">
                <img class="logo" src="../../../assets/images/logo/logo.svg" alt="Respyr" />

                <!-- Step 1: request OTP -->
                <form id="loginForm" autocomplete="on">
                    <h1>Forgot password?</h1>
                    <p class="sub">Enter your admin ID and we'll email a one-time code to your registered address.</p>

                    <div class="alert-err" id="msg"></div>

                    <div class="field">
                        <label for="username">Admin ID</label>
                        <div class="input-wrap">
                            <input type="text" id="username" placeholder="Your clinic ID" autocomplete="username" required />
                            <i class="fa-regular fa-user input-ico"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-dark" id="sendBtn">
                        Send OTP <i class="fa-regular fa-paper-plane"></i>
                    </button>

                    <a class="backlink" id="rspBackToLogin" href="../"><i class="fa-solid fa-arrow-left-long"></i>&nbsp; Back to login</a>
                    <script>
                        // the app opens this page in a WebView with ?appshow=true and no login page to go back to
                        if (new URLSearchParams(location.search).get("appshow") === "true") {
                            var b = document.getElementById("rspBackToLogin"); if (b) b.remove();
                        }
                    </script>
                </form>

                <!-- Step 2: verify OTP -->
                <form action="" id="otp-form" class="otp-form">
                    <h1>Enter the code</h1>
                    <p class="sub">We've sent a 4-digit code to your registered email.</p>

                    <div class="alert-ok" id="otp_sent"></div>

                    <div id="inputs" class="otp-inputs">
                        <input class="input" type="text" inputmode="numeric" maxlength="1" />
                        <input class="input" type="text" inputmode="numeric" maxlength="1" />
                        <input class="input" type="text" inputmode="numeric" maxlength="1" />
                        <input class="input" type="text" inputmode="numeric" maxlength="1" />
                    </div>

                    <p id="countdown"></p>
                    <button type="button" class="resend" id="resend-btn">Resend OTP</button>

                    <div class="alert-err" id="msg1"></div>

                    <button type="submit" class="btn-primary-dark">
                        Verify OTP <i class="fa-solid fa-arrow-right-long"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

<script>
// Node backend — LOCAL value; swap to the Lambda URL for production.
const NODE_API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "http://localhost:3001"   // local dev: node local.js in the backend repo
        : "https://u5fnjbxhhzx3xb4be224i7z3e40tbbua.lambda-url.ap-south-1.on.aws";

// The OTP is generated, stored (hashed) and checked ON THE SERVER — the
// browser only ever sees a masked email and a success/fail answer.
let timerInterval;

// Initial state
document.getElementById("otp-form").style.display = "none";
document.getElementById("resend-btn").style.display = "none";

function showErr(el, text) { el.textContent = text; el.classList.add("show"); }
function hideMsg(el) { el.textContent = ""; el.classList.remove("show"); }

// Send OTP
document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const msgEl = document.getElementById("msg");
    const otpSent = document.getElementById("otp_sent");
    const msgE2 = document.getElementById("msg1");
    const sendBtn = document.getElementById("sendBtn");

    hideMsg(msgEl); hideMsg(otpSent); hideMsg(msgE2);

    if (!username) {
        showErr(msgEl, "Please enter your admin ID.");
        return;
    }

    sendBtn.disabled = true;
    sendBtn.innerHTML = "Sending&hellip;";

    try {
        const response = await fetch(`${NODE_API}/api/dashboard/forgot-password/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username }),
        });
        const data = await response.json();

        if (data.success) {
            otpSent.innerHTML = '<i class="fa-solid fa-circle-check"></i> OTP sent to ' + data.email;
            otpSent.classList.add("show");

            document.getElementById("loginForm").style.display = "none";
            document.getElementById("otp-form").style.display = "block";
            startOtpTimer();
            resetOtpInputBorders();
            document.querySelector("#inputs .input").focus();
        } else {
            showErr(msgEl, data.message);
        }
    } catch (error) {
        showErr(msgEl, "Something went wrong. Please try again.");
        console.error("Error:", error);
    }

    sendBtn.disabled = false;
    sendBtn.innerHTML = 'Send OTP <i class="fa-regular fa-paper-plane"></i>';
});

// Start OTP timer
function startOtpTimer() {
    const countdownEl = document.getElementById("countdown");
    const resendBtn = document.getElementById("resend-btn");

    let timeLeft = 30;
    countdownEl.textContent = `Resend OTP in ${timeLeft}s`;
    resendBtn.style.display = "none";

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        countdownEl.textContent = `Resend OTP in ${timeLeft}s`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            countdownEl.textContent = "";
            resendBtn.style.display = "block";
        }
    }, 1000);
}

// Resend OTP
document.getElementById("resend-btn").addEventListener("click", function () {
    document.getElementById("loginForm").dispatchEvent(new Event("submit"));
});

// Verify OTP (server-side check — a correct code returns a short-lived
// reset token that the next page needs)
document.getElementById("otp-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    const otpInputs = document.querySelectorAll("#inputs .input");
    const enteredOtp = Array.from(otpInputs).map(input => input.value).join("");
    const msgE2 = document.getElementById("msg1");
    const username = document.getElementById("username").value.trim();

    hideMsg(msgE2);

    if (enteredOtp === "") {
        showErr(msgE2, "Please enter the OTP.");
        highlightOtpInputsRed();
        return;
    }

    try {
        const res = await fetch(`${NODE_API}/api/dashboard/forgot-password/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, otp: enteredOtp }),
        });
        const data = await res.json();

        if (data.success && data.reset_token) {
            resetOtpInputBorders();
            window.location.href = "../change-password/index.html?token=" + encodeURIComponent(data.reset_token);
        } else {
            showErr(msgE2, data.message || "Entered invalid OTP.");
            highlightOtpInputsRed();
        }
    } catch (err) {
        showErr(msgE2, "Cannot reach the server. Please try again.");
    }
});

// Auto tabbing between OTP inputs
const inputs = document.getElementById("inputs");
inputs.addEventListener("input", function (e) {
    const target = e.target;
    const val = target.value;

    if (isNaN(val)) {
        target.value = "";
        return;
    }

    if (val !== "") {
        const next = target.nextElementSibling;
        if (next) next.focus();
    }
});

inputs.addEventListener("keyup", function (e) {
    const target = e.target;
    const key = e.key.toLowerCase();

    if (key === "backspace" || key === "delete") {
        target.value = "";
        const prev = target.previousElementSibling;
        if (prev) prev.focus();
    }
});

// Red border on inputs
function highlightOtpInputsRed() {
    document.querySelectorAll("#inputs .input").forEach(input => input.classList.add("err"));
}

// Reset borders
function resetOtpInputBorders() {
    document.querySelectorAll("#inputs .input").forEach(input => input.classList.remove("err"));
}
</script>
</body>
</html>
