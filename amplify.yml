version: 1
frontend:
  phases:
    preBuild:
      commands:
        - "npm ci"
    build:
      # Every command is a quoted YAML scalar. CodeBuild rejects the buildspec
      # outright if a colon, brace or angle bracket leaks into a plain scalar,
      # so keep them quoted and keep the shell simple.
      commands:
        # Amplify console variables reach the build container but NOT the SSR
        # runtime - AWS withholds them from server components deliberately.
        # Next.js reads .env.production at build time and embeds it into the
        # server runtime config, so promote the ones the server needs.
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        - "env | grep -e SESSION_SECRET -e RESPYR_ >> .env.production || true"
        # Fail loudly rather than shipping a green build that 500s on sign-in.
        - "grep -q '^SESSION_SECRET=' .env.production || (echo 'FATAL - SESSION_SECRET is missing from the Amplify build environment. Add it under Hosting, Environment variables.' && exit 1)"
        - "npm run build"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*"
      - ".next/cache/**/*"
